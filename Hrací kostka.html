<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hrací kostka</title>
<style>
:root {
  --felt: #1f5a46; --felt-2: #17463a; --paper: #f6f1e4; --ink: #1d2320;
  --pip: #1d2320; --card: rgba(246,241,228,.1); --text: #f6f1e4; --accent: #e9b949;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --felt: #12372d; --felt-2: #0c2620; --paper: #e8e2d2; }
}
:root[data-theme="dark"] { --felt: #12372d; --felt-2: #0c2620; --paper: #e8e2d2; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: radial-gradient(ellipse at 50% 35%, var(--felt), var(--felt-2) 80%);
  background-color: var(--felt-2);
  display: flex; align-items: center; justify-content: center;
}
main { width: min(92vw, 380px); text-align: center; padding: 16px 0; }
h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: .01em; }
.sub { margin: 0 0 24px; opacity: .75; font-size: .95rem; }

.stage { perspective: 600px; height: 150px; display: grid; place-items: center; }
.die {
  width: 112px; height: 112px; padding: 14px;
  background: linear-gradient(145deg, #fffdf6, var(--paper));
  border-radius: 22px;
  box-shadow: 0 10px 0 -2px rgba(0,0,0,.18), 0 18px 30px rgba(0,0,0,.35), inset 0 -4px 8px rgba(0,0,0,.08);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
}
.die.rolling { animation: tumble .7s cubic-bezier(.3,.7,.4,1); }
@keyframes tumble {
  0% { transform: translateY(0) rotate(0) scale(1); }
  35% { transform: translateY(-40px) rotate(200deg) scale(1.08); }
  70% { transform: translateY(0) rotate(400deg) scale(.96); }
  100% { transform: translateY(0) rotate(720deg) scale(1); }
}
.pip { width: 78%; height: 78%; margin: auto; border-radius: 50%; background: var(--pip);
  box-shadow: inset 0 2px 3px rgba(255,255,255,.2); opacity: 0; }
.pip.on { opacity: 1; }
.die.empty::after { content: "?"; grid-area: 2 / 2; place-self: center; font-size: 2.6rem; color: var(--ink); opacity: .35; }

#roll {
  margin-top: 18px; font: inherit; font-size: 1.05rem; font-weight: 700;
  background: var(--accent); color: #2b2208; border: 0; border-radius: 999px;
  padding: 12px 32px; cursor: pointer; box-shadow: 0 4px 0 #a98524;
  transition: transform .1s, box-shadow .1s;
}
#roll:active { transform: translateY(3px); box-shadow: 0 1px 0 #a98524; }
#roll:disabled { opacity: .7; cursor: wait; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.hint { font-size: .8rem; opacity: .6; margin: 10px 0 0; }

.panel { margin-top: 26px; background: var(--card); border-radius: 14px; padding: 14px 16px; text-align: left; }
.panel h2 { font-size: .95rem; margin: 0 0 8px; font-weight: 700; }
.history { display: flex; gap: 6px; flex-wrap: wrap; min-height: 30px; }
.chip { width: 30px; height: 30px; border-radius: 8px; background: var(--paper); color: var(--ink);
  display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.empty-msg { opacity: .6; font-size: .85rem; align-self: center; }
.stats { display: grid; gap: 5px; margin-top: 4px; }
.row { display: grid; grid-template-columns: 16px 1fr 78px; align-items: center; gap: 8px; font-size: .85rem; }
.bar { position: relative; height: 8px; border-radius: 4px; background: rgba(246,241,228,.15); overflow: hidden; }
.bar::after { content: ""; position: absolute; top: -2px; bottom: -2px; left: 16.67%; width: 2px; background: var(--paper); opacity: .8; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.row b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: .78rem; opacity: .65; margin: 8px 0 0; }
#reset { margin-top: 12px; font: inherit; font-size: .85rem; color: var(--text); background: none;
  border: 1px solid rgba(246,241,228,.4); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.die.falling { animation: fall .9s ease-in forwards; }
@keyframes fall {
  0% { transform: translate(0,0) rotate(0); opacity: 1; }
  25% { transform: translate(40px,-6px) rotate(25deg); opacity: 1; }
  100% { transform: translate(120px,260px) rotate(200deg); opacity: 0; }
}
.msg { min-height: 1.4em; margin: 6px 0 0; font-weight: 700; color: var(--accent); }
.chance { display: block; margin-top: 22px; font-size: .9rem; }
#chance { width: 100%; margin-top: 8px; accent-color: var(--accent); }
.chip.fall { background: #b4472f; color: #fff; }
.fallrow { margin: 8px 0 0; font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { .die.falling { animation: none; opacity: .15; transform: translateY(60px) rotate(30deg); } .die.rolling { animation: none; } .bar::after { content: ""; position: absolute; top: -2px; bottom: -2px; left: 16.67%; width: 2px; background: var(--paper); opacity: .8; }
.bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Hrací kostka</h1>
  <p class="sub">Hoďte kostkou tlačítkem nebo mezerníkem.</p>

  <div class="stage"><div id="die" class="die empty" role="img" aria-label="Kostka, zatím nehozeno"></div></div>
  <p id="msg" class="msg"></p>
  <p id="live" class="sr" aria-live="polite"></p>

  <button id="roll" type="button">Hodit kostkou</button>
  <p class="hint">Mezerník nebo Enter také hází.</p>

  <label class="chance" for="chance">Šance, že kostka spadne ze stolu: <b id="chanceOut">5 %</b></label>
  <input id="chance" type="range" min="0" max="50" step="1" value="5">

  <section class="panel">
    <h2>Poslední hody</h2>
    <div id="history" class="history"><span class="empty-msg">Zatím jste nehodili.</span></div>
    <p id="fallrow" class="fallrow"></p>
    <div id="stats" class="stats"></div>
    <p class="note">Čárka v grafu značí teoretickou šanci každého čísla: 1/6 = 16,7 %. Naměřené podíly se k ní blíží s přibývajícími hody.</p>
    <button id="reset" type="button">Vymazat historii</button>
  </section>
</main>

<script>
const FACES = { // pozice teček v mřížce 3×3 (index 0–8)
  1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
};
const $ = id => document.getElementById(id);
const die = $("die"), btn = $("roll"), hist = $("history"), stats = $("stats"), live = $("live"), msg = $("msg"), chanceEl = $("chance"), fallrow = $("fallrow");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let rolls = [], busy = false;

for (let i = 0; i < 9; i++) die.append(Object.assign(document.createElement("span"), { className: "pip" }));
const pips = [...die.children];

function show(n) {
  pips.forEach((p, i) => p.classList.toggle("on", FACES[n].includes(i)));
  die.classList.remove("empty");
  die.setAttribute("aria-label", "Kostka ukazuje " + n);
}

function randomFace() { // rovnoměrné číslo 1–6 z kryptograficky bezpečného zdroje
  const a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= 4294967292); // bez zkreslení
  return (a[0] % 6) + 1;
}

function randomFloat() {
  const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296;
}

function render() {
  const valid = rolls.filter(r => r > 0), falls = rolls.length - valid.length;
  hist.replaceChildren();
  if (!rolls.length) hist.innerHTML = '<span class="empty-msg">Zatím jste nehodili.</span>';
  rolls.slice(-12).reverse().forEach(n => {
    const c = document.createElement("span"); c.className = n ? "chip" : "chip fall"; c.textContent = n || "✕"; c.title = n ? "Hod " + n : "Spadla ze stolu"; hist.append(c);
  });
    stats.replaceChildren();
  if (valid.length) for (let n = 1; n <= 6; n++) {
    const k = valid.filter(r => r === n).length;
    const row = document.createElement("div"); row.className = "row";
    const pct = k / valid.length * 100;
    row.innerHTML = `<span>${n}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${pct.toFixed(1).replace(".", ",")} % <small>(${k}×)</small></b>`;
    stats.append(row);
  }
  const fp = rolls.length ? falls / rolls.length * 100 : 0;
  fallrow.textContent = rolls.length
    ? `Spadla ze stolu: ${falls}× (${fp.toFixed(1).replace(".", ",")} % ze všech hodů)` : "";
}

function roll() {
  if (busy) return;
  busy = true; btn.disabled = true;
  const result = randomFace();
  const fell = randomFloat() < chanceEl.value / 100;
  msg.textContent = ""; die.classList.remove("falling");
  die.classList.remove("rolling"); void die.offsetWidth;
  if (!reduce) die.classList.add("rolling");

  const finish = () => {
    if (fell) {
      die.classList.remove("rolling"); die.classList.add("falling");
      rolls.push(0); render();
      msg.textContent = "Kostka spadla ze stolu! Hoďte znovu.";
      live.textContent = "Kostka spadla ze stolu";
      setTimeout(() => { busy = false; btn.disabled = false; }, reduce ? 0 : 900);
      return;
    }
    show(result); rolls.push(result); render();
    live.textContent = "Padlo " + result;
    busy = false; btn.disabled = false;
  };
  if (reduce) return finish();

  const t = setInterval(() => show(randomFace()), 90); // střídání tváří během hodu
  setTimeout(() => { clearInterval(t); finish(); }, 700);
}

btn.addEventListener("click", roll);
document.addEventListener("keydown", e => {
  if (e.code === "Space" && document.activeElement !== btn) { e.preventDefault(); roll(); }
});
chanceEl.addEventListener("input", () => { $("chanceOut").textContent = chanceEl.value + " %"; });
$("reset").addEventListener("click", () => {
  rolls = []; render(); msg.textContent = ""; die.classList.remove("falling");
  pips.forEach(p => p.classList.remove("on")); die.classList.add("empty");
  die.setAttribute("aria-label", "Kostka, zatím nehozeno");
});
render();
</script>
</body>
</html>
